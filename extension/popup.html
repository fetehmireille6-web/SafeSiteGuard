<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SafeSite Guard</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --border: #64748b;
        --safe: #16a34a;
        --caution: #f59e0b;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 300px;
        min-height: 220px;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      body {
        padding: 12px 12px 14px;
        border-radius: 18px;
        border: 1px solid var(--border);
        box-shadow: 0 12px 28px rgba(0,0,0,0.28);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .logo {
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, #22c55e, #0ea5e9);
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
      }

      h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 10px 0 8px;
      }

      .safe {
        background: rgba(22, 163, 74, 0.18);
        color: #bbf7d0;
        border: 1px solid rgba(22, 163, 74, 0.5);
      }

      .caution {
        background: rgba(245, 158, 11, 0.18);
        color: #fde68a;
        border: 1px solid rgba(245, 158, 11, 0.5);
      }

      .dangerous {
        background: rgba(220, 38, 38, 0.18);
        color: #fecaca;
        border: 1px solid rgba(220, 38, 38, 0.5);
      }

      .meta {
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .score {
        font-size: 30px;
        font-weight: 800;
        line-height: 1.1;
        margin: 6px 0 10px;
      }

      ul {
        margin: 0;
        padding-left: 18px;
        font-size: 11px;
        color: #e2e8f0;
        line-height: 1.5;
      }

      li {
        margin: 3px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo" aria-hidden="true"></div>
      <h3>SafeSite Guard</h3>
    </div>

    <div id="status" class="status">Checking...</div>
    <div class="meta" id="domain">Loading...</div>
    <div class="score" id="score">--</div>
    <ul id="reasons"></ul>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
