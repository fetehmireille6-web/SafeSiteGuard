<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SafeSite Guard Warning</title>
    <style>
      :root {
        --bg: #021c2d;
        --panel: rgba(9, 28, 43, 0.94);
        --panel-border: rgba(116, 146, 175, 0.4);
        --text: #edf6ff;
        --muted: #d5dfec;
        --danger: #de4c4c;
        --danger-dark: #c63d3d;
        --warning: #f2c94c;
        --soft: #16324a;
        --button: #f7cf4a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .overlay {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .card {
        width: min(540px, 92vw);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 18px 18px 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        max-height: 90vh;
        overflow-y: auto;
      }

      .badge {
        display: inline-block;
        background: linear-gradient(180deg, var(--danger) 0%, var(--danger-dark) 100%);
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.14);
      }

      .badge.warning {
        background: linear-gradient(180deg, #f3c74b 0%, #d8a61b 100%);
        color: #1d1d1d;
      }

      h1 {
        display: none;
      }

      p {
        color: var(--muted);
        margin: 0 0 12px;
        line-height: 1.5;
        font-size: 13px;
      }

      .url {
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(147, 170, 196, 0.28);
        border-radius: 8px;
        padding: 10px 12px;
        word-break: break-all;
        margin: 0 0 12px;
        color: #d6e7f8;
        font-size: 13px;
      }

      .reasons {
        margin: 8px 0 0;
        padding: 0 0 0 18px;
        list-style: disc;
      }

      .reasons li {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 4px 0;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 14px;
      }

      button {
        flex: 1;
        border: 1px solid rgba(147, 170, 196, 0.35);
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        pointer-events: auto;
      }

      .back {
        background: rgba(147, 170, 196, 0.08);
        color: #edf6ff;
      }

      .continue {
        background: var(--button);
        color: #1c1c1c;
        border-color: rgba(255,255,255,0.15);
      }

      .status-note {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 10px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="card">
        <div class="badge" id="verdict">DANGEROUS</div>
        <h1>SafeSite Guard Warning</h1>
        <p id="message">This site has been flagged as dangerous and is blocked.</p>
        <div class="url" id="targetUrl">Loading...</div>

        <ul class="reasons" id="reasonsList"></ul>

        <div class="actions">
          <button class="back" id="goBack" type="button">Go back</button>
          <button class="continue" id="continueAnyways" type="button">Continue anyway</button>
        </div>
        <div class="status-note" id="statusNote"></div>
      </div>
    </div>

    <script src="warning.js"></script>
  </body>
</html>
