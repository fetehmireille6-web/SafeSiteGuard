<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SafeSite Guard Settings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        background: #111827;
        color: #f8fafc;
      }
      .card {
        max-width: 460px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #334155;
        border-radius: 12px;
        background: #0f172a;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #111827;
        color: #f8fafc;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #16a34a;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        min-height: 20px;
        color: #bbf7d0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>SafeSite Guard Settings</h2>
      <form id="backend-form">
        <label for="backendUrl">Backend URL</label>
        <input id="backendUrl" type="url" placeholder="https://your-backend.example.com" required />
        <button type="submit">Save</button>
      </form>
      <div id="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
